document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:flex;justify-content:space-between;font-size:12.5px;color:#c9bcd0;margin-bottom:4px\"><span>'+c[0]+'<\u002Fspan><b>'+c[1]+'%<\u002Fb><\u002Fdiv><div class=\"bar\"><i style=\"width:'+c[1]+'%;background:'+c[2]+'\"><\u002Fi><\u002Fdiv><\u002Fdiv>').join('')+\n      '<\u002Fdiv>';\n  }\n\n  /* SAFETY */\n  safety(){\n    this.$view.innerHTML=this.head('Safety','the safety net and crisis routing. these never get monetized and never auto-publish.')+\n      '<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px\">'+\n        [['Safety-net catches · 7d','41','routed to resources'],['Awaiting human review','2','urgent'],['Resource click-throughs','29','988 / Samaritans'],['False positives','7','released to publish']].map(k=>'<div class=\"card kpi\"><b style=\"font-size:24px\">'+k[1]+'<\u002Fb><span>'+k[0]+'<\u002Fspan><div style=\"margin-top:6px;font-size:11px;color:#9a8fa2\">'+k[2]+'<\u002Fdiv><\u002Fdiv>').join('')+\n      '<\u002Fdiv>'+\n      '<div class=\"card\" style=\"border-color:rgba(226,75,74,.3)\"><div style=\"display:flex;align-items:center;gap:9px;margin-bottom:14px\"><span style=\"width:9px;height:9px;border-radius:50%;background:#E24B4A;animation:breathe 2s infinite\"><\u002Fspan><b style=\"font-family:Sora,sans-serif;font-weight:700;font-size:14px;color:#f5b0b0\">Awaiting human review<\u002Fb><\u002Fdiv>'+\n        '<div class=\"qrow\"><span style=\"flex:1;font-size:13.5px;font-family:Newsreader,serif;font-style:italic\">\"I don\\'t see the point in any of this anymore\" — held, resources shown, not published.<\u002Fspan><button class=\"btn btn-approve\" data-s>open case<\u002Fbutton><\u002Fdiv>'+\n        '<div class=\"qrow\"><span style=\"flex:1;font-size:13.5px;font-family:Newsreader,serif;font-style:italic\">a comment expressing self-harm intent — author shown findahelpline.<\u002Fspan><button class=\"btn btn-approve\" data-s>open case<\u002Fbutton><\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<div class=\"card\" style=\"margin-top:14px\"><b style=\"font-family:Sora,sans-serif;font-weight:700;font-size:14px;display:block;margin-bottom:8px\">Crisis resources shown to users<\u002Fb><div style=\"font-family:Newsreader,serif;font-style:italic;font-size:13.5px;color:#9a8fa2;line-height:1.6\">988 Suicide &amp; Crisis Lifeline (US) · Samaritans 116 123 (UK) · findahelpline.com (global). these are surfaced automatically and logged here. configure regional resources in settings.<\u002Fdiv><\u002Fdiv>';\n    this.$view.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>this.toast('case opened — handle with care.')));\n  }\n\n  /* CONFIG (§17E platform settings — all changes logged) */\n  config(){\n    const grp=(title,rows)=>'<div class=\"card\" style=\"margin-bottom:14px\"><b style=\"font-family:Sora,sans-serif;font-weight:700;font-size:13px;display:block;margin-bottom:12px\">'+title+'<\u002Fb>'+rows+'<\u002Fdiv>';\n    const field=(label,val,note)=>'<div class=\"qrow\"><div style=\"flex:1\"><div style=\"font-size:13.5px;color:#e9dfee\">'+label+'<\u002Fdiv>'+(note?'<div style=\"font-size:11.5px;color:#6e6675;margin-top:2px\">'+note+'<\u002Fdiv>':'')+'<\u002Fdiv><input value=\"'+val+'\" style=\"width:90px;background:#0f0a12;border:.5px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 10px;color:#f2e9ef;font-family:Inter;font-size:13px;text-align:right\" data-cfg/><\u002Fdiv>';\n    this.$view.innerHTML=this.head('Platform config','the tunable constants. every change is logged. SPEC §8 launch values live here.')+\n      grp('Rest & lifecycle', field('rest window (hours)','72','silence before a room rests'))+\n      grp('Resonance &amp; Hall of Fame', \n        field('relate weight','3','')+field('reaction weight','1','')+field('side-added weight','25','')+field('teller-heard bonus','40','')+\n        field('Held band','120','min score to induct')+field('Honored band','300','')+field('Legend band','700','')\n      )+\n      grp('Geography', field('city activation','500','rested rooms to open a city hall'))+\n      grp('Safety &amp; moderation',\n        field('crisis auto-publish','off','never — locked')+field('mod SLA target (hrs)','4','')+\n        '<div class=\"qrow\"><div style=\"flex:1\"><div style=\"font-size:13.5px;color:#e9dfee\">crisis resources<\u002Fdiv><div style=\"font-size:11.5px;color:#6e6675;margin-top:2px\">988 · Samaritans · findahelpline — per country<\u002Fdiv><\u002Fdiv><span data-act style=\"font-size:12.5px;color:#f7b8d4;cursor:pointer\">edit directory →<\u002Fspan><\u002Fdiv>'+\n        '<div class=\"qrow\"><div style=\"flex:1\"><div style=\"font-size:13.5px;color:#e9dfee\">break-glass identity reveal<\u002Fdiv><div style=\"font-size:11.5px;color:#6e6675;margin-top:2px\">not built — legal handled out-of-band, manually<\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;color:#6e6675\">🔒 disabled<\u002Fspan><\u002Fdiv>'\n      )+\n      grp('Audit', '<div class=\"qrow\"><div style=\"flex:1\"><div style=\"font-size:13.5px;color:#e9dfee\">action log<\u002Fdiv><div style=\"font-size:11.5px;color:#6e6675;margin-top:2px\">append-only · every action attributed · exportable<\u002Fdiv><\u002Fdiv><span data-act style=\"font-size:12.5px;color:#f7b8d4;cursor:pointer\">open log →<\u002Fspan><\u002Fdiv>')+\n      '<div style=\"display:flex;justify-content:flex-end;margin-top:6px\"><button class=\"btn btn-approve\" data-save style=\"padding:9px 18px\">save changes (logged)<\u002Fbutton><\u002Fdiv>';\n    this.$view.querySelector('[data-save]').addEventListener('click',()=>this.toast('config saved — written to the audit log.'));\n    this.$view.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>this.toast('opening…')));\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
