*{box-sizing:border-box}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}

@keyframes blinkdot{0%,80%,100%{opacity:.2}40%{opacity:1}}

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {

  get REACTIONS(){ return [
    {k:'heard', emoji:'🤍', label:"i hear you",      color:'#e7548a'},
    {k:'same',  emoji:'🫂', label:"omg same",         color:'#c87c4a'},
    {k:'strong',emoji:'💪', label:"you've got this",  color:'#5B8A5E'},
    {k:'time',  emoji:'🌿', label:"it gets easier",   color:'#7F77DD'},
    {k:'brave', emoji:'✨', label:"so brave",          color:'#c1a02b'},
  ];}

  userRooms(){
    try{
      const sits=JSON.parse(localStorage.getItem('shutap_situations')||'[]');
      return sits.filter(s=>s&&s.visibility==='public'&&s.id&&s.title).map(s=>{
        const mins=Math.max(1,Math.round((Date.now()-(s.createdAt||Date.now()))/60000));
        const hours = mins<60 ? mins+'m' : (mins<1440 ? Math.round(mins/60)+'h' : Math.round(mins/1440)+'d');
        return { id:s.id, alias:'you', emoji:'🌸',
          title:s.title, support:(s.mode==='advice'?'advice':'heard'),
          relates:0, sitting:1, hours,
          reactions:{heard:0,same:0,strong:0,time:0,brave:0},
          body:s.body||s.title,
          reflection:'just opened. the room is here when others arrive.',
          hall:'healing', _mine:true };
      }).reverse();
    }catch(e){ return []; }
  }
  get ROOMS(){
    const user=this.userRooms();
    const seed=(typeof window!=='undefined'&&window.SHUTAP_SEED&&window.SHUTAP_SEED.rooms&&window.SHUTAP_SEED.rooms.length)?window.SHUTAP_SEED.rooms:this.FALLBACK_ROOMS;
    const seen={}; const out=[];
    user.concat(seed).forEach(r=>{ if(r&&!seen[r.id]){ seen[r.id]=1; out.push(r); } });
    return out;
  }
  get FALLBACK_ROOMS(){ return [
    {id:'0',alias:'Quiet Nigerian Swan',emoji:'🦢',title:"I told my mum I've been struggling for months. she cried and said she never knew.",support:'heard',relates:47,sitting:18,hours:'2h',reactions:{heard:55,same:28,strong:10,time:5,brave:2},body:"I've been holding this for a long time. managing it, mostly. it gets hard in the evenings. last week I finally told her — sitting at her kitchen table, hands around tea, trying to find normal words for it. she went very quiet and then she cried. not out of pity. out of not knowing. that was somehow harder than anything.",reflection:"something about the way she said she never knew. that part is sitting with me too.",hall:'healing'},
    {id:'1',alias:'Defiant Kenyan Lion',emoji:'🦁',title:"I left a six-figure job and nobody in my family has spoken to me since.",support:'advice',relates:83,sitting:26,hours:'5h',reactions:{heard:38,same:41,strong:12,time:6,brave:3},body:"I gave seven years to that job. the salary was real, the title was real, and the thing it was slowly doing to me was also real. I left in January. I haven't regretted it for one day. but I also haven't spoken to my dad, my sister, or my aunt since the announcement. I don't know if I'm supposed to wait them out or reach out first.",reflection:"seven years is not a small thing to hand back. neither is the silence after.",hall:'brave'},
    {id:'2',alias:'Mortified Polish Hedgehog',emoji:'🦔',title:"I wrote a letter to my ex and sent it by accident to our whole group chat.",support:'heard',relates:124,sitting:11,hours:'6h',reactions:{heard:22,same:58,strong:5,time:10,brave:5},body:"full letter. three months of feelings. sent at 2am to the group chat we're both still in. the one with twelve people in it. I screenshotted the phone like that would somehow undo it. it did not undo it. fourteen people have now read my whole inner life. one of them left a heart emoji. I don't know if that's kind or devastating.",reflection:"fourteen people reading your inner life and one leaving a heart. that one is doing a lot of work.",hall:'relatable'},
    {id:'3',alias:'Patient Indian Dove',emoji:'🕊',title:"I've been going to therapy for two years and I finally cried today.",support:'heard',relates:211,sitting:34,hours:'1d',reactions:{heard:61,same:24,strong:8,time:5,brave:2},body:"i don't know what shifted. same room, same chair, same questions we've been circling for two years. she asked about my mother and something just — opened. i sat there ugly-crying for twenty minutes. on the train home I felt lighter than I have in years. also embarrassed. also relieved. i wanted to tell someone and this felt like the right room.",reflection:"two years of circling and then the thing you needed finally came up. that's how it tends to go.",hall:'healing'},
    {id:'4',alias:'Wistful Ethiopian Butterfly',emoji:'🦋',title:"My sister told me she's been scared of me since we were kids. I had no idea.",support:'heard',relates:89,sitting:31,hours:'3h',reactions:{heard:42,same:31,strong:14,time:8,brave:5},body:"she said it so quietly. we were doing the dishes. 'i've always been a bit scared of you.' i put the plate down and said 'of me?' and she nodded. i don't know what version of me she saw growing up. i genuinely don't. i've been sitting with that word — scared — for three days now.",reflection:"something you thought you knew about yourself and it turns out the story was different from where they were standing.",hall:'loving'},
    {id:'5',alias:'Tender Brazilian Hare',emoji:'🐇',title:"I'm the first person in my family to go to university and I'm failing.",support:'advice',relates:156,sitting:22,hours:'8h',reactions:{heard:48,same:37,strong:9,time:4,brave:2},body:"everyone at home thinks I'm doing fine. i send photos of the campus. i smile on calls. the truth is i've failed two modules and i've been hiding it. i don't know how to be the first one to do this and also the first one to fail at it. i don't know who i'd even be if i told them.",reflection:"the weight of being first at something includes the weight of feeling like you can't afford to struggle at it.",hall:'brave'}
  ];}

  get NUDGES(){ return [
    "something happened to you too. the room is open.",
    "three people just found their 'omg same' moment. wondering if yours is still out there.",
    "you've been reading for a while. is there something in here that's yours?",
    "the room doesn't ask you to be okay. it just asks you to say it out loud.",
  ];}

  eyeSVG(w,h){ return '<svg viewBox="0 0 140 96" fill="none" style="display:block;width:'+w+'px;height:'+h+'px;flex:none"><rect x="16" y="6" width="56" height="84" rx="28" fill="url(#eyeG)"/><rect x="84" y="6" width="56" height="84" rx="28" fill="url(#eyeG)"/><ellipse cx="44" cy="62" rx="19" ry="24" fill="url(#pupG)"/><ellipse cx="112" cy="62" rx="19" ry="24" fill="url(#pupG)"/><path d="M44 22 C41 18 35 18 35 24 C35 30 44 36 44 36 C44 36 53 30 53 24 C53 18 47 18 44 22Z" fill="#fff" opacity=".95"/><path d="M112 22 C109 18 103 18 103 24 C103 30 112 36 112 36 C112 36 121 30 121 24 C121 18 115 18 112 22Z" fill="#fff" opacity=".95"/></svg>'; }

  renderVals(){
    return {
      authArea: el=>{ this.$authArea=el; this.buildAuthHeader(); },
      feed: el=>{ this.$feed=el; },
      reshapeBanner: el=>{ this.$reshape=el; },
      roomPage: el=>{ this.$rpage=el; },
      roomPageBody: el=>{ this.$rbody=el; },
      askPill: el=>{ this.$pill=el; if(el) this.wireDrag(el); },
      askLabel: el=>{ this.$pillLabel=el; },
      askRoot: el=>{ this.$askRoot=el; },
      askInput: el=>{ this.$askInput=el; if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') this.runAsk(); }); },
      askReply: el=>{ this.$askReply=el; },
      toastEl: el=>{ this.$toast=el; },
      goSpill: ()=>{ window.location.href='Landing.dc.html#spill'; },
      openAsk: ()=>this.openAsk(),
      closeAsk: ()=>this.closeAsk(),
      runAsk: ()=>this.runAsk()
    };
  }

  getAlias(){ try{ const r=localStorage.getItem('shutap_alias'); return r?JSON.parse(r):null; }catch(e){ return null; } }
  // §1a — contributing needs an identity; reading never does. gate sits exactly at the contribute action.
  requireAuth(then, trigger){
    if(this.getAlias()){ then(); return true; }
    if(window.ShutapAuth){ window.ShutapAuth.requireAuth(()=>{ this.buildAuthHeader&&this.buildAuthHeader(); then(); }, trigger); return false; }
    if(window.ShutapFeedback) ShutapFeedback.track('signin_wall_hit',{trigger:trigger||'contribute'});
    try{ sessionStorage.setItem('shutap_returnTo', location.href); }catch(e){}
    this.toast('one step — name your alias to join in.');
    setTimeout(()=>{ location.href='Welcome.dc.html'; }, 650);
    return false;
  }
  signOut(){ try{ localStorage.removeItem('shutap_alias'); }catch(e){} this.buildAuthHeader(); this.toast('signed out.'); }

  buildAuthHeader(){
    if(!this.$authArea) return;
    const alias=this.getAlias();
    if(alias){
      this.$authArea.innerHTML=
        '<div data-toggle role="button" style="display:flex;align-items:center;gap:7px;background:#fff;border:.5px solid rgba(11,8,15,.12);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;transition:.18s">'+
          '<span style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f060a0,#890041);display:grid;place-items:center;font-size:14px;flex:none">'+(alias.emoji||'🦉')+'</span>'+
          '<span style="font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#4a3040">'+(alias.name||'')+'</span>'+
        '</div>'+
        '<div data-menu style="position:absolute;top:calc(100% + 9px);right:0;width:210px;background:#fff;border:.5px solid rgba(11,8,15,.10);border-radius:16px;box-shadow:0 24px 50px -24px rgba(60,10,30,.35);padding:7px;display:none;z-index:70;animation:pop .16s ease">'+
          '<a href="Landing.dc.html" class="menu-item" style="display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#4a3040;text-decoration:none">home</a>'+
          '<a href="HallOfFame.dc.html" class="menu-item" style="display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#4a3040;text-decoration:none">hall of fame</a>'+
          '<a href="Room.dc.html" class="menu-item" style="display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#4a3040;text-decoration:none">open a room</a>'+
          '<div style="height:.5px;background:rgba(11,8,15,.08);margin:6px 0"></div>'+
          '<div data-spill class="menu-item" role="button" style="display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#c1216b;cursor:pointer">say something →</div>'+
          '<div data-signout class="menu-item" role="button" style="display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#9e7a8c;cursor:pointer">sign out</div>'+
        '</div>';
      const t=this.$authArea.querySelector('[data-toggle]'),m=this.$authArea.querySelector('[data-menu]');
      t.addEventListener('click',e=>{ e.stopPropagation(); m.style.display=m.style.display==='block'?'none':'block'; });

    this.$rpage.style.display='block';

  injectRoomSchema(r){
    try{
      let s=document.getElementById('_roomld'); if(!s){ s=document.createElement('script'); s.type='application/ld+json'; s.id='_roomld'; document.head.appendChild(s); }
      const top=(r.comments&&r.comments[0])||null;
      const ld={"@context":"https://schema.org","@type":"DiscussionForumPosting","headline":r.title,"articleBody":r.body,"author":{"@type":"Person","name":r.alias,"description":"pseudonymous member of Shutap"},"interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":r.relates},{"@type":"InteractionCounter","interactionType":"https://schema.org/CommentAction","userInteractionCount":(r.comments?r.comments.length:0)}],"isPartOf":{"@type":"WebSite","name":"Shutap","url":"https://shutap.com/"}};
      if(top) ld.comment=[{"@type":"Comment","text":top.text,"author":{"@type":"Person","name":top.alias}}];
      s.textContent=JSON.stringify(ld);
      document.title=r.title.replace(/\.$/,'')+' — a room on Shutap';
    }catch(e){}
  }

  openReportMenu(r){
    let prev=document.getElementById('_repmenu'); if(prev) prev.remove();
    const root=document.createElement('div'); root.id='_repmenu';
    root.style.cssText='position:fixed;inset:0;z-index:115;display:flex;align-items:flex-end;justify-content:center;font-family:Inter,system-ui,sans-serif';
    const back=document.createElement('div'); back.style.cssText='position:absolute;inset:0;background:rgba(10,5,14,.5);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s';
    const card=document.createElement('div'); card.style.cssText='position:relative;width:100%;max-width:460px;background:#fff;border-top-left-radius:24px;border-top-right-radius:24px;box-shadow:0 -14px 50px -12px rgba(40,8,24,.4);padding:10px 12px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.9,.25,1)';
    const items=[
      ['report','🚩','report this room','flag it for a moderator to review'],
      ['block','🚫','block this person','you won\u2019t see '+(r.alias||'them')+' again'],
      ['mute','🔕','mute this room','stop updates from this thread'],
      ['mine','🫥','this is about me','request a review / takedown']
    ];
    card.innerHTML='<div style="width:36px;height:4px;border-radius:2px;background:rgba(11,8,15,.14);margin:6px auto 12px"></div>'+
      items.map(it=>'<div data-r="'+it[0]+'" role="button" style="display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border-radius:14px;cursor:pointer"><span style="font-size:19px;flex:none;line-height:1.1">'+it[1]+'</span><div><div style="font-family:Sora,sans-serif;font-weight:600;font-size:14.5px;color:'+(it[0]==='mine'?'#0b080f':(it[0]==='report'||it[0]==='block'?'#b3261e':'#0b080f'))+'">'+it[2]+'</div><div style="font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#9e7a8c;margin-top:1px">'+it[3]+'</div></div></div>').join('')+
      '<div data-rcancel role="button" style="text-align:center;margin-top:6px;padding:14px;font-family:Sora,sans-serif;font-weight:600;font-size:14px;color:#6b4a5c;cursor:pointer">cancel</div>';
    root.appendChild(back); root.appendChild(card); document.body.appendChild(root);
    requestAnimationFrame(()=>{ back.style.opacity='1'; card.style.transform='translateY(0)'; });
    const close=()=>{ back.style.opacity='0'; card.style.transform='translateY(110%)'; setTimeout(()=>root.remove(),420); };
    back.addEventListener('click',close);
    card.querySelector('[data-rcancel]').addEventListener('click',close);
    card.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{
      const act=b.getAttribute('data-r');
      const msg={report:'reported. a moderator will look. thank you for keeping the room kind.',block:'blocked. you won\u2019t cross paths again.',mute:'muted. this thread will stay quiet.',mine:'got it. we\u2019ll review this and reach out about a takedown.'}[act];
      if(window.ShutapFeedback) ShutapFeedback.track(act==='report'||act==='mine'?'report_submitted':act+'_user',{target:'room:'+r.id,reason:act});
      close(); setTimeout(()=>this.toast('🤍 '+msg),200);
    }));
  }

  async guideComments(r){
    const guideEl=this.$rbody.querySelector('#_guide');
    const chipsEl=this.$rbody.querySelector('#_chips');
    let res;
    try{
      const prompt='You are the companion on Shutap — warm, perceptive, never clinical. A room is open on this story (teller '+(r.support==='heard'?'asked just to be heard, no advice':'is open to advice')+'):\n"'+r.title+'"\n'+r.body.slice(0,280)+'\n\nWrite a SHORT guiding nudge (one sentence, lowercase) inviting people to vent/respond in a way that fits this specific story. Then 3 first-person opener phrases (3-6 words each, lowercase, ending with …) that someone could tap to start their comment about THIS story.\n\nReturn STRICT JSON: {"guide":"…","starters":["…","…","…"]}';
      const raw=await window.claude.complete({messages:[{role:'user',content:prompt}]});
      res=JSON.parse(raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1));
    }catch(e){ res=this.guideFallback(r); }
    if(!res||!res.guide) res=this.guideFallback(r);
    if(guideEl) guideEl.textContent=res.guide;
    if(chipsEl){
      chipsEl.innerHTML='';
      (res.starters||[]).slice(0,3).forEach(s=>{
        const c=document.createElement('button');
        c.style.cssText='background:#fff;border:1px solid rgba(231,84,138,.3);border-radius:999px;padding:7px 13px;cursor:pointer;font-family:Newsreader,serif;font-style:italic;font-size:12.5px;color:#c1216b;transition:.15s';
        c.textContent=s;
        c.addEventListener('mouseover',()=>c.style.background='#fdf0f5');
        c.addEventListener('mouseout',()=>c.style.background='#fff');
        c.addEventListener('click',()=>{ const cmt=this.$rbody.querySelector('#_cmt'); if(cmt){ cmt.value=s+' '; cmt.focus(); cmt.style.height='auto'; cmt.style.height=cmt.scrollHeight+'px'; } });
        chipsEl.appendChild(c);
      });
    }
  }

  guideFallback(r){
    const heard = r.support==='heard';
    const byHall={
      love:{guide:"this one's about love and the mess it leaves. what did it stir in you?",starters:["i've been here too…","reading this, i felt…","the part that got me…"]},
      family:{guide:"family stories cut deep. say the thing this brings up — gently.",starters:["in my family…","what i'd want to hear…","this reminds me…"]},
      work:{guide:"they put something at risk here. tell them how it lands.",starters:["i did something like this…","honestly, i think…","what helped me…"]},
      home:{guide:"small stakes, big feelings. vent it however it comes out.",starters:["i'd have…","the part i sat with…","i once…"]}
    };
    const base = byHall[r.hall] || {guide: heard?"they asked just to be heard. how does this land with you?":"they're open to advice — but start with what you felt.", starters:heard?["i've been exactly here…","reading this, i felt…","the part that got me…"]:["if it were me…","one thing i'd say…","what helped me…"]};
    return base;
  }

  closeRoomPage(){ if(this.$rpage){ if(this.$rpage.style.display==='block' && window.ShutapFeedback){ const sec=Math.round((Date.now()-(this._roomOpenT||Date.now()))/1000); ShutapFeedback.track(sec<4?'room_bounce':(sec>=20?'room_dwell_long':'room_dwell'),{sec:sec,target:'room'}); if(sec>=12) setTimeout(()=>{ if(window.ShutapFeedback) ShutapFeedback.ask('the room',{line:'did sitting in that room help?'}); },500); } this.$rpage.style.display='none'; } document.body.style.overflow=''; if(this.$pill){ this.$pill.style.display='flex'; this.$pill.style.zIndex='35'; } }

  // §22 T4 — first relate on a room: the companion offers the "not alone" card at the peak
  offerShare(r){
    const n=(r.relates||0)+1;
    if(!window.ShutapShare) return;
    window.ShutapShare.offer('T4', {
      valence:'positive', kind:'relate',
      big:'+'+n, headline:'i wasn\u2019t the only one.',
      companion:'you\u2019re not the only one \u2014 '+n+' people have been exactly here. want to show that someone else isn\u2019t alone either?',
      caption:'turns out i wasn\u2019t the only one. '+n+' people have been here too 🤍 you\u2019re not alone either →',
      loopLabel:'you\u2019re not alone either →',
      url:'https://shutap.com/room/'+r.id,
      privacy:'only the resonance leaves \u2014 never the story or any name.'
    });
  }

  /* ═══════════ ASK / RESHAPE ═══════════ */
  wireDrag(el){
    try{ const p=JSON.parse(localStorage.getItem('shutap_bubble')||'null'); if(p){ el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.bottom='auto'; } }catch(e){}
    let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
    const down=(e)=>{ dragging=true; moved=false; const pt=e.touches?e.touches[0]:e; const r=el.getBoundingClientRect(); ox=r.left; oy=r.top; sx=pt.clientX; sy=pt.clientY; el.style.cursor='grabbing'; el.style.animation='none'; el.setPointerCapture&&e.pointerId!=null&&el.setPointerCapture(e.pointerId); };
    const move=(e)=>{ if(!dragging) return; const pt=e.touches?e.touches[0]:e; const dx=pt.clientX-sx, dy=pt.clientY-sy; if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true; const sz=el.offsetWidth; let nx=Math.max(8,Math.min(window.innerWidth-sz-8,ox+dx)), ny=Math.max(8,Math.min(window.innerHeight-sz-8,oy+dy)); el.style.left=nx+'px'; el.style.top=ny+'px'; el.style.bottom='auto'; e.preventDefault&&e.preventDefault(); };
    const up=()=>{ if(!dragging) return; dragging=false; el.style.cursor='grab'; if(moved){ this._dragged=true; setTimeout(()=>{ this._dragged=false; },50); const r=el.getBoundingClientRect(); try{ localStorage.setItem('shutap_bubble', JSON.stringify({x:r.left,y:r.top})); }catch(e){} } };
    el.addEventListener('pointerdown',down); window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',up);
  }

  openAsk(){ if(this._dragged) return; if(this.$askRoot){ this.$askRoot.style.display='flex'; setTimeout(()=>this.$askInput&&this.$askInput.focus(),120); } }
  closeAsk(){ if(this.$askRoot) this.$askRoot.style.display='none'; if(this.$askReply) this.$askReply.innerHTML=''; }

  async applyAsk(q){
    if(!q) return;
    if(window.ShutapFeedback) ShutapFeedback.track('search',{text:q,target:'stream'});
    if(this.$reshape){
      this.$reshape.style.display='block';
      this.$reshape.innerHTML='<div style="background:linear-gradient(160deg,#2e0d1a,#1a0a12);border-radius:14px;padding:15px 18px;color:#f7e8f0;display:flex;gap:11px;align-items:flex-start">'+this.eyeSVG(20,15)+'<div style="flex:1"><div style="font-family:Sora,sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#f7b8d4;margin-bottom:5px">reshaped for — "'+this.esc(q)+'"</div><div style="font-family:Newsreader,serif;font-style:italic;font-size:15px;color:#f7e8f0;line-height:1.5" data-rl>rooms that feel closest are up front.</div></div><span data-clr style="font-family:Newsreader,serif;font-style:italic;font-size:12px;color:#9e7a8c;cursor:pointer;flex:none">restore →</span></div>';
      this.$reshape.querySelector('[data-clr]').addEventListener('click',()=>{ this.$reshape.style.display='none'; this.roomOrder=this.ROOMS.map(r=>r.id); this.buildFeed(); if(this.$pillLabel) this.$pillLabel.textContent='talk to the room…'; });
    }
    try{
      const items=this.ROOMS.map(r=>r.id+'·'+r.title.slice(0,60)+'·'+r.hall).join('\n');
      const prompt='You are the companion on Shutap. User asked: "'+q+'". Rooms available:\n'+items+'\n\nReturn JSON only: {"line":"one warm sentence (lowercase) naming what you found","order":["id",...]}\nOrder all room ids by relevance, most relevant first.';
      const raw=await window.claude.complete({messages:[{role:'user',content:prompt}]});
      const s=raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1);
      const res=JSON.parse(s);
      if(res.order) this.roomOrder=res.order.map(String);
      const rl=this.$reshape&&this.$reshape.querySelector('[data-rl]');
      if(rl&&res.line) rl.textContent=res.line;
    }catch(e){}
    this.buildFeed();
    if(this.$pillLabel) this.$pillLabel.textContent='reshape again…';
  }

  async runAsk(){
    const q=(this.$askInput&&this.$askInput.value||'').trim(); if(!q) return;
    if(/\b(kill myself|end it all|don'?t want to (be here|live|exist)|want to (die|disappear|vanish)|suicid|self.?harm|no reason to live|better off dead|hurt myself)\b/i.test(q)){
      if(this.$askReply) this.$askReply.innerHTML='<div style="display:flex;gap:9px;align-items:flex-start">'+this.eyeSVG(20,15)+'<div><div style="color:#f7e8f0;margin-bottom:7px">that\u2019s not a search \u2014 and you don\u2019t have to carry it alone.</div><div style="font-family:Inter;font-size:12.5px;color:#f7b8d4;line-height:1.7">988 (US) · Samaritans 116 123 (UK) · findahelpline.com</div></div></div>';
      return;
    }
    if(this.$askReply) this.$askReply.innerHTML='<span style="display:inline-flex;gap:4px;align-items:center"><i style="width:6px;height:6px;border-radius:50%;background:#e7548a;display:block;animation:blinkdot 1.2s infinite"></i><i style="width:6px;height:6px;border-radius:50%;background:#e7548a;display:block;animation:blinkdot 1.2s .2s infinite"></i><i style="width:6px;height:6px;border-radius:50%;background:#e7548a;display:block;animation:blinkdot 1.2s .4s infinite"></i></span>';
    await this.applyAsk(q);
    this.closeAsk();
    const url=new URL(location.href); url.searchParams.set('ask',q); history.pushState({},'',url);
  }

  /* §22.4 manual fallback — deliberate share from the room overflow; de-identified headline only */
  shareRoom(r){
    if(!window.ShutapShare) return;
    window.ShutapShare.manual({
      trigger:'manual_room', kind:'generic',
      headline:'\u201c'+r.title+'\u201d',
      companion:'sharing this room \u2014 de-identified. only the headline and a link travel, never the full story.',
      caption:'\u201c'+r.title+'\u201d \u2014 a room on Shutap. someone in here has lived your exact thing →',
      url:'https://shutap.com/room/'+r.id,
      loopLabel:'take yours \u2192',
      privacy:'only the headline + link leave \u2014 never the full story.'
    });
  }

  esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

</script>
