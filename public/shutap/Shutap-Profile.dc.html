  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- THE MIRROR (private · wisdom graph) -->\n  <a href=\"Landing.dc.html#mirror\" style=\"display:block;text-decoration:none;margin-top:16px;background:linear-gradient(160deg,#2e0d1a,#1a0a12);border:.5px solid rgba(255,255,255,.12);border-radius:18px;padding:20px 22px;color:#f7e8f0\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <svg viewBox=\"0 0 56 56\" fill=\"none\" style=\"width:30px;height:30px;flex:none\"><rect x=\"15.25\" y=\"16\" width=\"11.5\" height=\"24\" rx=\"5.75\" fill=\"url(#eyeG)\"><\u002Frect><rect x=\"29.25\" y=\"16\" width=\"11.5\" height=\"24\" rx=\"5.75\" fill=\"url(#eyeG)\"><\u002Frect><ellipse cx=\"21\" cy=\"29\" rx=\"4\" ry=\"5\" fill=\"url(#pupG)\"><\u002Fellipse><ellipse cx=\"35\" cy=\"29\" rx=\"4\" ry=\"5\" fill=\"url(#pupG)\"><\u002Fellipse><\u002Fsvg>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:15px\">the mirror<\u002Fdiv>\n        <div style=\"font-family:'Newsreader',serif;font-style:italic;font-size:13px;color:#caaebb;margin-top:2px\">your private self-portrait — patterns, your arc, and what others who've been here came through. drawn from your own scans &amp; rooms.<\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-family:'Newsreader',serif;font-style:italic;font-size:13px;color:#f7b8d4;flex:none\">open →<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fa>\n\n  <!-- TABS -->\n  <div style=\"display:flex;gap:20px;border-bottom:.5px solid rgba(11,8,15,.10);margin:26px 0 20px;overflow-x:auto;scrollbar-width:none\">\n    <div ref=\"{{ tabRooms }}\" onclick=\"{{ showRooms }}\" class=\"tab active\">your rooms<\u002Fdiv>\n    <div ref=\"{{ tabActivity }}\" onclick=\"{{ showActivity }}\" class=\"tab\">activity<\u002Fdiv>\n    <div ref=\"{{ tabJournal }}\" onclick=\"{{ showJournal }}\" class=\"tab\">private journal<\u002Fdiv>\n    <div ref=\"{{ tabSettings }}\" onclick=\"{{ showSettings }}\" class=\"tab\">settings<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div ref=\"{{ panel }}\"><\u002Fdiv>\n\n<\u002Fmain>\n\n<div ref=\"{{ companionBubble }}\" role=\"button\" tabindex=\"0\" aria-label=\"Ask the companion\" style=\"position:fixed;left:calc(50% - 29px);bottom:24px;z-index:35;width:58px;height:58px;border-radius:50%;background:rgba(231,84,138,0.18);backdrop-filter:blur(4px);box-shadow:0 12px 30px -8px rgba(60,10,30,.35);cursor:grab;display:flex;align-items:center;justify-content:center;animation:pulse 4s infinite;touch-action:none;user-select:none\">\n  <svg viewBox=\"0 0 56 56\" fill=\"none\" style=\"width:32px;height:32px;display:block;pointer-events:none\"><rect x=\"15.25\" y=\"16\" width=\"11.5\" height=\"24\" rx=\"5.75\" fill=\"url(#eyeG)\"><\u002Frect><rect x=\"29.25\" y=\"16\" width=\"11.5\" height=\"24\" rx=\"5.75\" fill=\"url(#eyeG)\"><\u002Frect><ellipse cx=\"21\" cy=\"29\" rx=\"4\" ry=\"5\" fill=\"url(#pupG)\"><\u002Fellipse><ellipse cx=\"35\" cy=\"29\" rx=\"4\" ry=\"5\" fill=\"url(#pupG)\"><\u002Fellipse><\u002Fsvg>\n<\u002Fdiv>\n\n<div ref=\"{{ toastEl }}\" style=\"position:fixed;left:50%;bottom:26px;transform:translate(-50%,300px);z-index:92;background:#0b080f;border-radius:999px;padding:11px 18px;color:#fff;font-family:'Newsreader',serif;font-style:italic;font-size:14px;box-shadow:0 20px 44px -20px rgba(60,10,30,.5);transition:transform .4s cubic-bezier(.2,.7,.2,1);max-width:92vw\"><\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n\n  getAlias(){ try{ return JSON.parse(localStorage.getItem('shutap_alias')||'null'); }catch(e){ return null; } }\n  isAdmin(){ try{ return localStorage.getItem('shutap_role')==='admin'; }catch(e){ return false; } }\n  goJoin(){ try{ sessionStorage.setItem('shutap_returnTo', location.href); }catch(e){} location.href='Welcome.dc.html'; }\n  signOut(){ try{ localStorage.removeItem('shutap_alias'); }catch(e){} this.buildAuthHeader(); this.toast&&this.toast('signed out.'); }\n  buildAuthHeader(){\n    if(!this.$authArea) return;\n    const alias=this.getAlias();\n    if(alias){\n      this.$authArea.innerHTML=\n        '<div data-toggle role=\"button\" tabindex=\"0\" style=\"display:flex;align-items:center;gap:7px;background:#fff;border:.5px solid rgba(11,8,15,.12);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;transition:.18s\">'+\n          '<span style=\"width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f060a0,#890041);display:grid;place-items:center;font-size:14px;flex:none\">'+(alias.emoji||'\\uD83E\\uDD89')+'<\u002Fspan>'+\n          '<span style=\"font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#4a3040\">'+(alias.name||'Anonymous')+'<\u002Fspan>'+\n        '<\u002Fdiv>'+\n        '<div data-menu style=\"position:absolute;top:calc(100% + 9px);right:0;width:210px;background:#fff;border:.5px solid rgba(11,8,15,.10);border-radius:16px;box-shadow:0 24px 50px -24px rgba(60,10,30,.35);padding:7px;display:none;z-index:70;animation:pop .16s ease\">'+\n          '<a href=\"Profile.dc.html\" class=\"menu-item\" style=\"display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#4a3040;text-decoration:none\">your profile<\u002Fa>'+\n          '<a href=\"Profile.dc.html#settings\" class=\"menu-item\" style=\"display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#4a3040;text-decoration:none\">settings<\u002Fa>'+\n          '<div data-spill class=\"menu-item\" role=\"button\" style=\"display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#c1216b;cursor:pointer\">spill it \\u2192<\u002Fdiv>'+\n          '<a href=\"Landing.dc.html#mirror\" class=\"menu-item\" style=\"display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#a01a55;text-decoration:none\">the mirror ✦<\u002Fa>'+\n          '<div style=\"height:.5px;background:rgba(11,8,15,.08);margin:6px 0\"><\u002Fdiv>'+\n          (this.isAdmin()?'<a href=\"Admin.dc.html\" class=\"menu-item\" style=\"display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#9e7a8c;text-decoration:none\">admin dashboard<\u002Fa>':'')+\n          '<div data-signout class=\"menu-item\" role=\"button\" style=\"display:block;padding:9px 11px;border-radius:10px;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#9e7a8c;cursor:pointer\">sign out<\u002Fdiv>'+\n        '<\u002Fdiv>';\n      const t=this.$authArea.querySelector('[data-toggle]'),m=this.$authArea.querySelector('[data-menu]');\n      t.addEventListener('click',e=>{ e.stopPropagation(); m.style.display=m.style.display==='block'?'none':'block'; });\n      this.$authArea.querySelector('[data-spill]').addEventListener('click',()=>{ m.style.display='none'; window.location.href='Landing.dc.html#spill'; });\n      this.$authArea.querySelector('[data-signout]').addEventListener('click',()=>{ m.style.display='none'; this.signOut(); });\n    } else {\n      this.$authArea.innerHTML='<div data-join role=\"button\" tabindex=\"0\" style=\"display:inline-flex;align-items:center;background:#e7548a;color:#fff;border-radius:999px;padding:9px 18px;font-family:Sora,sans-serif;font-weight:700;font-size:13px;cursor:pointer\">join \\u2192<\u002Fdiv>';\n      this.$authArea.querySelector('[data-join]').addEventListener('click',()=>this.goJoin());\n    }\n  }\n  situations(){ try{ return JSON.parse(localStorage.getItem('shutap_situations')||'[]'); }catch(e){ return []; } }\n  saveSituations(s){ try{ localStorage.setItem('shutap_situations', JSON.stringify(s.slice(-30))); }catch(e){} }\n  esc(s){ return (s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\n  timeAgo(t){ if(!t) return 'just now'; const d=Date.now()-t; const m=Math.floor(d/60000), h=Math.floor(d/3600000), dy=Math.floor(d/86400000); if(dy>=7) return Math.floor(dy/7)+'w ago'; if(dy>=1) return dy+'d ago'; if(h>=1) return h+'h ago'; if(m>=1) return m+'m ago'; return 'just now'; }\n  promoteJournalToRoom(id){\n    const all=this.situations(); const s=all.find(x=>String(x.id)===String(id)); if(!s) return;\n    s.visibility='public'; s.edited=true; s.updatedAt=Date.now(); this.saveSituations(all);\n    if(window.ShutapFeedback) ShutapFeedback.track('visibility_changed',{from:'private',to:'public'});\n    window.location.href='Stream.dc.html#room-'+s.id;\n  }\n  makePrivate(id){\n    const all=this.situations(); const s=all.find(x=>String(x.id)===String(id)); if(!s) return;\n    s.visibility='private'; s.edited=true; s.updatedAt=Date.now(); this.saveSituations(all);\n    if(window.ShutapFeedback) ShutapFeedback.track('visibility_changed',{from:'public',to:'private'});\n    this.toast('moved to your private journal \\u2014 only you can see it now.');\n    this.show('rooms');\n  }\n  deleteSituation(id, fromTab){\n    const all=this.situations(); const s=all.find(x=>String(x.id)===String(id)); if(!s) return;\n    s.status='deleted'; s.deletedAt=Date.now(); this.saveSituations(all);\n    if(window.ShutapFeedback) ShutapFeedback.track('room_deleted',{had_outcome:false});\n    this.show(fromTab||'rooms');\n    // grace-window undo\n    if(this.$toast){\n      this.$toast.innerHTML='deleted. <span data-undo style=\"color:#f7b8d4;cursor:pointer;text-decoration:underline\">undo<\u002Fspan>';\n      this.$toast.style.transform='translate(-50%,0)'; clearTimeout(this._t);\n      const u=this.$toast.querySelector('[data-undo]');\n      if(u) u.addEventListener('click',()=>{ const a2=this.situations(); const s2=a2.find(x=>String(x.id)===String(id)); if(s2){ s2.status='open'; delete s2.deletedAt; this.saveSituations(a2); } this.$toast.style.transform='translate(-50%,300px)'; this.show(fromTab||'rooms'); });\n      this._t=setTimeout(()=>{ this.$toast.style.transform='translate(-50%,300px)'; },5000);\n    }\n  }\n  actionBar(s, tab){\n    const A=(label,attr,color)=>'<span '+attr+' role=\"button\" style=\"font-family:Newsreader,serif;font-style:italic;font-size:13px;color:'+(color||'#c1216b')+';cursor:pointer\">'+label+'<\u002Fspan>';\n    const edit='<a href=\"Landing.dc.html?editJournal='+s.id+'\" style=\"font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#c1216b;text-decoration:none\">edit with spill \\u2192<\u002Fa>';\n    const move = tab==='journal'\n      ? A('post to a room \\u2192','data-promote=\"'+s.id+'\"')\n      : A('move to private journal','data-private=\"'+s.id+'\"');\n    const del = A('delete','data-del=\"'+s.id+'\"','#b3261e');\n    return '<div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:11px;padding-top:11px;border-top:.5px solid rgba(11,8,15,.06)\">'+edit+move+del+'<\u002Fdiv>';\n  }\n  wireActions(tab){\n    if(!this.$panel) return;\n    this.$panel.querySelectorAll('[data-promote]').forEach(b=>b.addEventListener('click',()=>this.promoteJournalToRoom(b.getAttribute('data-promote'))));\n    this.$panel.querySelectorAll('[data-private]').forEach(b=>b.addEventListener('click',()=>this.makePrivate(b.getAttribute('data-private'))));\n    this.$panel.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>this.deleteSituation(b.getAttribute('data-del'), tab)));\n  }\n  getSettings(){ try{ return Object.assign({notifyRelate:true,notifyHearts:true,notifyComments:true,notifySide:true,notifyHall:true,notifyOutcome:true,notifyCompanion:false,seatVisible:true,allowAdvice:true,hofOptOut:false,quietHours:false,emailDigest:true,rerollsLeft:3,aliasLocked:false}, JSON.parse(localStorage.getItem('shutap_settings')||'{}')); }catch(e){ return {}; } }\n  setSetting(k,v){ const s=this.getSettings(); s[k]=v; try{ localStorage.setItem('shutap_settings', JSON.stringify(s)); }catch(e){} }\n\n  get ROOMS(){ if(window.SHUTAP_SEED&&window.SHUTAP_SEED.rooms) return window.SHUTAP_SEED.rooms; return []; }\n\n  renderVals(){\n    return {\n      companionBubble: el=>{ if(el) this.wireCompanion(el); },\n      avatar: el=>{ this.$avatar=el; },\n      aliasName: el=>{ this.$alias=el; },\n      handle: el=>{ this.$handle=el; },\n      panel: el=>{ this.$panel=el; },\n      authArea: el=>{ this.$authArea=el; this.buildAuthHeader(); },\n      toastEl: el=>{ this.$toast=el; },\n      tabRooms: el=>{ this.$tabs=Object.assign({},this.$tabs,{rooms:el}); },\n      tabActivity: el=>{ this.$tabs=Object.assign({},this.$tabs,{activity:el}); },\n      tabJournal: el=>{ this.$tabs=Object.assign({},this.$tabs,{journal:el}); },\n      tabSettings: el=>{ this.$tabs=Object.assign({},this.$tabs,{settings:el}); },\n      showRooms: ()=>this.show('rooms'),\n      showActivity: ()=>this.show('activity'),\n      showJournal: ()=>this.show('journal'),\n      showSettings: ()=>this.show('settings')\n    };\n  }\n\n  wireCompanion(el){\n    try{ const p=JSON.parse(localStorage.getItem('shutap_bubble')||'null'); if(p){ el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.bottom='auto'; } }catch(e){}\n    let dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0;\n    const down=(e)=>{ dragging=true;moved=false; const pt=e.touches?e.touches[0]:e; const r=el.getBoundingClientRect(); ox=r.left;oy=r.top;sx=pt.clientX;sy=pt.clientY; el.style.cursor='grabbing'; el.style.animation='none'; el.setPointerCapture&&e.pointerId!=null&&el.setPointerCapture(e.pointerId); };\n    const move=(e)=>{ if(!dragging)return; const pt=e.touches?e.touches[0]:e; const dx=pt.clientX-sx,dy=pt.clientY-sy; if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true; const sz=el.offsetWidth; el.style.left=Math.max(8,Math.min(window.innerWidth-sz-8,ox+dx))+'px'; el.style.top=Math.max(8,Math.min(window.innerHeight-sz-8,oy+dy))+'px'; el.style.bottom='auto'; e.preventDefault&&e.preventDefault(); };\n    const up=()=>{ if(!dragging)return; dragging=false; el.style.cursor='grab'; if(moved){ const r=el.getBoundingClientRect(); try{ localStorage.setItem('shutap_bubble',JSON.stringify({x:r.left,y:r.top})); }catch(e){} } else { location.href='Landing.dc.html#ask'; } };\n    el.addEventListener('pointerdown',down); window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',up);\n  }\n\n  componentDidMount(){\n    document.addEventListener('click',e=>{ if(this.$authArea&&!this.$authArea.contains(e.target)){ const m=this.$authArea.querySelector('[data-menu]'); if(m) m.style.display='none'; } });\n    const a=this.getAlias();\n    if(a){\n      if(this.$avatar) this.$avatar.textContent=a.emoji||'🦉';\n      if(this.$alias) this.$alias.textContent=a.name||'Anonymous';\n      if(this.$handle) this.$handle.textContent='@'+(a.name||'anonymous').toLowerCase().replace(/\\s+/g,'-')+' · joined this spring';\n    }\n    this.$tabs=this.$tabs||{};\n    this.show('rooms');\n    if(location.hash==='#settings') this.show('settings');\n    else if(location.hash==='#journal') this.show('journal');\n  }\n\n  toast(m){ if(!this.$toast) return; this.$toast.textContent=m; this.$toast.style.transform='translate(-50%,0)'; clearTimeout(this._t); this._t=setTimeout(()=>{ this.$toast.style.transform='translate(-50%,300px)'; },3200); }\n\n  show(which){\n    Object.entries(this.$tabs).forEach(([k,el])=>{ if(el) el.classList.toggle('active', k===which); });\n    if(which==='rooms') this.renderRooms();\n    else if(which==='activity') this.renderActivity();\n    else if(which==='journal') this.renderJournal();\n    else if(which==='settings') this.renderSettings();\n  }\n\n  roomLink(r,sub){\n    return '<a href=\"Stream.dc.html#room-'+r.id+'\" style=\"display:flex;align-items:center;gap:13px;background:#fff;border:.5px solid rgba(11,8,15,.08);border-radius:15px;padding:13px 15px;text-decoration:none;color:inherit;transition:.16s\" onmouseover=\"this.style.borderColor=\\'#e7548a\\'\" onmouseout=\"this.style.borderColor=\\'rgba(11,8,15,.08)\\'\">'+\n      '<span style=\"width:42px;height:42px;border-radius:12px;background:#f7e8f0;display:grid;place-items:center;font-size:21px;flex:none\">'+r.emoji+'<\u002Fspan>'+\n      '<div style=\"flex:1;min-width:0\"><h4 style=\"font-family:Sora,sans-serif;font-weight:700;font-size:14px;line-height:1.3;margin:0 0 5px\">'+r.title+'<\u002Fh4><div style=\"font-size:11.5px;color:#9e7a8c;font-family:Newsreader,serif;font-style:italic\">'+sub+'<\u002Fdiv><\u002Fdiv>'+\n      '<span style=\"color:#cdbac4;font-size:18px;flex:none\">›<\u002Fspan><\u002Fa>';\n  }\n\n  renderRooms(){\n    if(!this.$panel) return;\n    const a=this.getAlias()||{emoji:'\\uD83E\\uDD89'};\n    const mine=this.situations().filter(s=>s&&s.visibility==='public'&&s.status!=='deleted').slice().reverse();\n    this.$panel.innerHTML=\n      '<div style=\"font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#6b4a5c;margin-bottom:14px\">rooms you opened — your stories, your rules. you can edit, rest, or reopen them anytime.<\u002Fdiv>'+\n      (mine.length\n        ? '<div style=\"display:flex;flex-direction:column;gap:14px\">'+mine.map(s=>'<div>'+this.roomLink({id:s.id,emoji:a.emoji||'\\uD83C\\uDF38',title:s.title||'my situation'}, (s.relates? (s.relates+' said \\u2018omg same\\u2019 \\u00b7 open') : 'just opened \\u00b7 '+(s.sitting||1)+' sitting in now'))+this.actionBar(s,'rooms')+'<\u002Fdiv>').join('')+'<\u002Fdiv>'\n        : '<div style=\"font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#9e7a8c;background:#fff;border:.5px dashed rgba(11,8,15,.14);border-radius:16px;padding:22px;text-align:center\">no rooms yet. when you spill and post it publicly, your room shows up here.<div style=\"margin-top:12px\"><span class=\"prose-link\" onclick=\"window.location.href=\\'Landing.dc.html#spill\\'\">spill something \\u2192<\u002Fspan><\u002Fdiv><\u002Fdiv>');\n    this.wireActions('rooms');\n  }\n\n  renderActivity(){\n    if(!this.$panel) return;\n    const acts=[\n      {emoji:'🤍',txt:'you said <b>i hear you<\u002Fb> to a room about a sister who went quiet',when:'2h'},\n      {emoji:'🫂',txt:'you related to <b>\"I left a six-figure job…\"<\u002Fb>',when:'5h'},\n      {emoji:'💬',txt:'you offered a comment in a room about a group-chat mistake',when:'1d'},\n      {emoji:'🌿',txt:'you said <b>it gets easier<\u002Fb> to a first-gen student',when:'2d'},\n      {emoji:'✨',txt:'a room you opened reached the <b>Most Relatable<\u002Fb> hall',when:'1w'}\n    ];\n    this.$panel.innerHTML='<div style=\"display:flex;flex-direction:column;gap:2px\">'+\n      acts.map(a=>'<div style=\"display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:.5px solid rgba(11,8,15,.06)\"><span style=\"width:34px;height:34px;border-radius:50%;background:#f7e8f0;display:grid;place-items:center;font-size:16px;flex:none\">'+a.emoji+'<\u002Fspan><div style=\"flex:1;font-family:Newsreader,serif;font-style:italic;font-size:14.5px;color:#2e1a26;line-height:1.4\">'+a.txt+'<\u002Fdiv><span style=\"font-size:11.5px;color:#9e7a8c;flex:none\">'+a.when+'<\u002Fspan><\u002Fdiv>').join('')+\n    '<\u002Fdiv>';\n  }\n\n  renderJournal(){\n    if(!this.$panel) return;\n    const journals=this.situations().filter(s=>s&&s.visibility==='private'&&s.status!=='deleted'&&s.kind!=='scan');\n    const scans=this.situations().filter(s=>s&&s.kind==='scan'&&s.status!=='deleted').slice().reverse();\n    const entry=(s)=>{\n      const body=(s.body||'').replace(/\\s+/g,' ').slice(0,150);\n      return '<div style=\"background:#fff;border:.5px solid rgba(11,8,15,.08);border-radius:16px;padding:16px 17px\">'+\n        '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><span style=\"font-family:Sora,sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6b4a5c;background:rgba(11,8,15,.06);border-radius:999px;padding:3px 9px\">private draft<\u002Fspan>'+(s.pillar?'<span style=\"font-size:11.5px;color:#9e7a8c;font-family:Newsreader,serif;font-sty 002Fdiv>'+\n        '<div class=\"srow\"><div><div style=\"font-family:Sora,sans-serif;font-weight:600;font-size:14px\">how scoring works<\u002Fdiv><div style=\"font-size:12.5px;color:#9e7a8c;margin-top:2px\">methodology &amp; trust.<\u002Fdiv><\u002Fdiv><span data-act=\"trust\" style=\"flex:none;font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#c1216b;cursor:pointer\">read →<\u002Fspan><\u002Fdiv>'+\n        '<div class=\"srow\"><div><div style=\"font-family:Sora,sans-serif;font-weight:600;font-size:14px;color:#c1216b\">sign out<\u002Fdiv><\u002Fdiv><span data-act=\"signout\" style=\"flex:none;font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#c1216b;cursor:pointer\">sign out →<\u002Fspan><\u002Fdiv>'+\n        '<div class=\"srow\"><div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif;font-weight:600;font-size:14px;color:#b3261e\">delete account<\u002Fdiv><div style=\"font-size:12.5px;color:#9e7a8c;margin-top:2px;line-height:1.45\">we hard-delete your private data — account, scans, drafts, journal. your published rooms stay, <b style=\"color:#6b4a5c\">anonymised<\u002Fb>, so the people you supported keep what helped them. you can choose to remove those too.<\u002Fdiv><\u002Fdiv><span data-act=\"delete\" style=\"flex:none;font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#b3261e;cursor:pointer\">delete →<\u002Fspan><\u002Fdiv>'\n      ,'private');\n\n    this.$panel.querySelectorAll('[data-sw]').forEach(el=>{ el.addEventListener('click',()=>{ const k=el.dataset.sw; const on=!el.classList.contains('on'); el.classList.toggle('on',on); el.setAttribute('aria-checked',on); this.setSetting(k,on); this.toast('saved.'); }); });\n    this.$panel.querySelectorAll('[data-av]').forEach(el=>{ el.addEventListener('click',()=>{ const e=el.dataset.av; const al=this.getAlias()||{}; al.emoji=e; try{localStorage.setItem('shutap_alias',JSON.stringify(al));}catch(x){} if(this.$avatar) this.$avatar.textContent=e; this.renderSettings(); this.toast('avatar updated.'); }); });\n    this.$panel.querySelectorAll('[data-act]').forEach(el=>{ el.addEventListener('click',()=>{ const act=el.dataset.act; if(act==='signout'){ try{localStorage.removeItem('shutap_alias');}catch(e){} window.location.href='Landing.dc.html'; } else if(act==='export'){ this.toast('we\\'ll email your data shortly.'); } else if(act==='delete'){ this.toast('deletion needs email confirmation.'); } else if(act==='blocked'){ this.toast('block list coming soon.'); } else if(act==='reroll'){ window.location.href='Welcome.dc.html'; } else if(act==='reauth'){ this.toast('re-authentication coming soon.'); } else if(act==='trust'){ this.toast('methodology page coming soon.'); } else if(act==='sensitivities'){ this.toast('sensitivity controls coming soon.'); } else if(act==='subscribe'){ this.openPaywall(); } else if(act==='cancelsub'){ try{localStorage.setItem('shutap_sub_status','canceled');}catch(e){} this.toast('cancelled — the mirror stays open until your period ends.'); this.renderSettings(); } else if(act==='resume'){ try{localStorage.setItem('shutap_sub_status','active');}catch(e){} this.toast('welcome back — the mirror keeps going.'); this.renderSettings(); } else if(act==='changeplan'){ const p=(()=>{try{return localStorage.getItem('shutap_sub_plan');}catch(e){return 'annual';}})(); try{localStorage.setItem('shutap_sub_plan', p==='annual'?'monthly':'annual');}catch(e){} this.toast('plan changed.'); this.renderSettings(); } else if(act==='restore'){ this.toast('purchases restored.'); } }); });\n  }\n\n  openPaywall(){\n    const ov=document.createElement('div');\n    ov.style.cssText='position:fixed;inset:0;z-index:99;display:flex;align-items:flex-end;justify-content:center';\n    ov.innerHTML=\n      '<div data-x style=\"position:absolute;inset:0;background:rgba(10,5,14,.7);backdrop-filter:blur(7px)\"><\u002Fdiv>'+\n      '<div role=\"dialog\" style=\"position:relative;width:100%;max-width:460px;background:linear-gradient(160deg,#2e0d1a,#1a0a12);border:.5px solid rgba(255,255,255,.16);border-radius:22px 22px 0 0;padding:26px 24px;animation:fadeUp .3s ease\">'+\n        '<div style=\"text-align:center;margin-bottom:20px\"><div style=\"font-family:Newsreader,serif;font-style:italic;font-size:22px;line-height:1.35;color:#f7e8f0\">your reflection keeps going.<\u002Fdiv><div style=\"font-family:Newsreader,serif;font-style:italic;font-size:14.5px;color:#caaebb;margin-top:8px;line-height:1.5\">the full mirror — every pattern, your arc, the daily pull, threads, and what others who\\u2019ve been here came through.<\u002Fdiv><\u002Fdiv>'+\n        '<div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">'+\n          '<div data-plan=\"annual\" style=\"border:1.5px solid #e7548a;background:rgba(231,84,138,.10);border-radius:14px;padding:15px 17px;cursor:pointer\"><div style=\"font-family:Sora,sans-serif;font-weight:700;font-size:14px;color:#f7e8f0\">annual <span style=\"font-family:Sora;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#1a0a12;background:#f7b8d4;border-radius:999px;padding:2px 7px;margin-left:6px\">best value<\u002Fspan><\u002Fdiv><div style=\"font-family:Newsreader,serif;font-style:italic;font-size:12.5px;color:#caaebb;margin-top:2px\">7 days free, then yearly<\u002Fdiv><\u002Fdiv>'+\n          '<div data-plan=\"monthly\" style=\"border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:15px 17px;cursor:pointer\"><div style=\"font-family:Sora,sans-serif;font-weight:700;font-size:14px;color:#f7e8f0\">monthly<\u002Fdiv><div style=\"font-family:Newsreader,serif;font-style:italic;font-size:12.5px;color:#caaebb;margin-top:2px\">7 days free, then monthly<\u002Fdiv><\u002Fdiv>'+\n        '<\u002Fdiv>'+\n        '<div data-start role=\"button\" style=\"text-align:center;background:#e7548a;color:#fff;border-radius:14px;padding:15px;font-family:Sora,sans-serif;font-weight:700;font-size:15px;cursor:pointer\">start 7-day free trial<\u002Fdiv>'+\n        '<div style=\"font-family:Newsreader,serif;font-style:italic;font-size:12px;color:#8a7080;text-align:center;margin-top:12px;line-height:1.5\">cancel anytime — as easy as one tap. venting, scan &amp; being heard stay free, always.<\u002Fdiv>'+\n        '<div data-x2 style=\"text-align:center;margin-top:14px;font-family:Newsreader,serif;font-style:italic;font-size:13px;color:#9b8090;cursor:pointer\">not now<\u002Fdiv>'+\n      '<\u002Fdiv>';\n    document.body.appendChild(ov);\n    let plan='annual';\n    const sel=()=>{ ov.querySelector('[data-plan=\"annual\"]').style.borderColor=plan==='annual'?'#e7548a':'rgba(255,255,255,.16)'; ov.querySelector('[data-plan=\"annual\"]').style.background=plan==='annual'?'rgba(231,84,138,.10)':'transparent'; ov.querySelector('[data-plan=\"monthly\"]').style.borderColor=plan==='monthly'?'#e7548a':'rgba(255,255,255,.16)'; ov.querySelector('[data-plan=\"monthly\"]').style.background=plan==='monthly'?'rgba(231,84,138,.10)':'transparent'; };\n    ov.querySelector('[data-plan=\"annual\"]').addEventListener('click',()=>{ plan='annual'; sel(); });\n    ov.querySelector('[data-plan=\"monthly\"]').addEventListener('click',()=>{ plan='monthly'; sel(); });\n    const close=()=>ov.remove();\n    ov.querySelector('[data-x]').addEventListener('click',close);\n    ov.querySelector('[data-x2]').addEventListener('click',close);\n    ov.querySelector('[data-start]').addEventListener('click',()=>{ try{ localStorage.setItem('shutap_sub_status','trialing'); localStorage.setItem('shutap_sub_plan',plan); }catch(e){} close(); this.toast('your free trial is on — the full mirror is open.'); this.renderSettings(); });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
